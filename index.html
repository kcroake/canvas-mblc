<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="container-fluid">
      <h1>Play with Space</h1>
    </header>
      <div class="container-fluid">
        <div class="row">
          <div class="col">
            <form action="" method="get">
              <div class="my-3">
                <label for="x">
                  Floor Space Width (X)  
                </label>
                <input id="x" class="form-control" name="X" type="number" />
              </div>
              <div class="my-3">
                <label for="y">
                  Floor Space Height (Y)
                </label>
                <input id="y" class="form-control" name="Y" type="number" />
              </div>
              <div class="my-3">
                <button class="btn btn-primary none">Submit SQFootage</button>
              </div>
            </form>
            <div class="my-3">
              <button id="add-chair" class="btn btn-primary">Add Chair </button>
            </div>
            <div class="my-3">
              <button id="add-shelf" class="btn btn-primary">Add Shelf</button>
            </div>
            <div class="my-3">
              <button id="delete-node" class="btn btn-danger">Delete Node</button>
            </div>
            <div class="my-3">
              <button id="zoom-in" class="btn btn-primary">
                Zoom In (using scale) 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-in" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11M13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
                  <path d="M10.344 11.742q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1 6.5 6.5 0 0 1-1.398 1.4z"/>
                  <path fill-rule="evenodd" d="M6.5 3a.5.5 0 0 1 .5.5V6h2.5a.5.5 0 0 1 0 1H7v2.5a.5.5 0 0 1-1 0V7H3.5a.5.5 0 0 1 0-1H6V3.5a.5.5 0 0 1 .5-.5"/>
                </svg>
              </button>
            </div>
            <div class="my-3">
              <button id="zoom-out" class="btn btn-primary">
                Zoom Out (using scale) 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-out" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11M13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
                  <path d="M10.344 11.742q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1 6.5 6.5 0 0 1-1.398 1.4z"/>
                  <path fill-rule="evenodd" d="M3 6.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="col-10">
            <div id="create-a-space"></div>
          </div>
        </div>
      </div>
      
      
      <script src="./node_modules/konva/konva.js"></script>
      <script src="./main.js"></script>
  </body>
</html>
